<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Từ điển Việt – Nhật</title>
<style>
  :root {
    --bg: #eef1f4; --panel: #fff; --ink: #1b2a41; --soft: #5d6b7e;
    --line: #cfd6de; --accent: #3f6e34; --accent-bg: #e3eddf;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.6 "Segoe UI", "Hiragino Sans", "Yu Gothic UI", "Noto Sans JP", "Noto Sans", sans-serif;
  }
  main { max-width: 720px; margin: 0 auto; padding: 40px 20px 80px; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; font-weight: 700; }
  .sub { color: var(--soft); margin: 0 0 24px; }
  .search { display: flex; gap: 8px; }
  input[type=search], input[type=text] {
    flex: 1; min-width: 0; padding: 14px 16px; font-size: 1.1rem; color: var(--ink);
    background: var(--panel); border: 2px solid var(--line); border-radius: 6px;
  }
  input:focus, button:focus-visible, summary:focus-visible { outline: 3px solid var(--accent); outline-offset: 1px; }
  .status { margin: 14px 0 10px; color: var(--soft); font-size: .9rem; }
  ul { list-style: none; margin: 0; padding: 0; }
  li.entry {
    display: grid; grid-template-columns: 112px 1fr; gap: 16px; align-items: start;
    background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
    padding: 14px 18px; margin-bottom: 10px;
  }
  .word { font-size: 2rem; line-height: 1.3; font-weight: 600; overflow-wrap: anywhere; }
  .word rt { font-size: .45em; font-weight: 400; color: var(--soft); }
  .romaji { color: var(--soft); font-size: .85rem; }
  .vi { font-size: 1.1rem; font-weight: 600; }
  .pos { display: inline-block; margin-left: 8px; padding: 0 8px; font-size: .8rem; font-weight: 400;
         color: var(--accent); background: var(--accent-bg); border-radius: 10px; }
  .ex { margin: 8px 0 0; padding-left: 12px; border-left: 3px solid var(--accent); font-size: .95rem; }
  .ex span { display: block; color: var(--soft); }
  mark { background: var(--accent-bg); color: inherit; border-radius: 2px; }
  details { margin-top: 36px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 12px 18px; }
  summary { cursor: pointer; font-weight: 600; }
  .form { display: grid; gap: 8px; margin-top: 12px; grid-template-columns: 1fr 1fr; }
  .form .wide { grid-column: 1 / -1; }
  .form input { padding: 10px 12px; font-size: 1rem; }
  button {
    padding: 10px 18px; font-size: 1rem; font-weight: 600; color: #fff; background: var(--accent);
    border: 0; border-radius: 6px; cursor: pointer;
  }
  button.ghost { color: var(--accent); background: var(--accent-bg); }
  @media (max-width: 520px) {
    li.entry { grid-template-columns: 1fr; gap: 4px; }
    .form { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<main>
  <h1>Từ điển Việt – Nhật</h1>
  <p class="sub">Gõ tiếng Việt (có hoặc không dấu), chữ Nhật hoặc romaji.</p>

  <div class="search">
    <input id="q" type="search" placeholder="Ví dụ: nước, mizu, 学校, たべる" autocomplete="off" autofocus aria-label="Tìm từ">
  </div>
  <div id="status" class="status" aria-live="polite"></div>
  <ul id="results"></ul>

  <details>
    <summary>Thêm từ mới</summary>
    <div class="form">
      <input id="n-jp" type="text" placeholder="Chữ Nhật (vd: 水)">
      <input id="n-kana" type="text" placeholder="Hiragana (vd: みず)">
      <input id="n-romaji" type="text" placeholder="Romaji (vd: mizu)">
      <input id="n-vi" type="text" placeholder="Nghĩa tiếng Việt">
      <input id="n-pos" class="wide" type="text" placeholder="Từ loại (vd: danh từ)">
      <button id="add" class="wide" type="button">Lưu từ</button>
    </div>
    <p id="add-msg" class="status" aria-live="polite"></p>
  </details>
</main>

<script>
// [chữ Nhật, kana, romaji, nghĩa tiếng Việt, từ loại, ví dụ (Nhật), ví dụ (Việt)]
const BASE = [
  ["水","みず","mizu","nước","danh từ","水を飲みます。","Tôi uống nước."],
  ["本","ほん","hon","sách","danh từ","本を読みます。","Tôi đọc sách."],
  ["学校","がっこう","gakkou","trường học","danh từ","学校へ行きます。","Tôi đến trường."],
  ["先生","せんせい","sensei","giáo viên, thầy cô","danh từ"],
  ["学生","がくせい","gakusei","học sinh, sinh viên","danh từ"],
  ["友達","ともだち","tomodachi","bạn bè","danh từ","友達と話します。","Tôi nói chuyện với bạn."],
  ["食べる","たべる","taberu","ăn","động từ","ご飯を食べる。","Ăn cơm."],
  ["飲む","のむ","nomu","uống","động từ"],
  ["行く","いく","iku","đi","động từ"],
  ["来る","くる","kuru","đến","động từ"],
  ["見る","みる","miru","nhìn, xem","động từ"],
  ["聞く","きく","kiku","nghe, hỏi","động từ"],
  ["話す","はなす","hanasu","nói chuyện","động từ"],
  ["読む","よむ","yomu","đọc","động từ"],
  ["書く","かく","kaku","viết","động từ"],
  ["大きい","おおきい","ookii","to, lớn","tính từ"],
  ["小さい","ちいさい","chiisai","nhỏ, bé","tính từ"],
  ["新しい","あたらしい","atarashii","mới","tính từ"],
  ["古い","ふるい","furui","cũ","tính từ"],
  ["高い","たかい","takai","cao; đắt","tính từ"],
  ["安い","やすい","yasui","rẻ","tính từ"],
  ["美味しい","おいしい","oishii","ngon","tính từ","このラーメンは美味しい。","Món mì này ngon."],
  ["家","いえ","ie","nhà","danh từ"],
  ["車","くるま","kuruma","xe hơi","danh từ"],
  ["電車","でんしゃ","densha","tàu điện","danh từ"],
  ["駅","えき","eki","nhà ga","danh từ","駅はどこですか。","Nhà ga ở đâu vậy?"],
  ["山","やま","yama","núi","danh từ"],
  ["川","かわ","kawa","sông","danh từ"],
  ["海","うみ","umi","biển","danh từ"],
  ["空","そら","sora","bầu trời","danh từ"],
  ["日本","にほん","nihon","Nhật Bản","danh từ"],
  ["ベトナム","ベトナム","betonamu","Việt Nam","danh từ"],
  ["ありがとう","ありがとう","arigatou","cảm ơn","cụm từ"],
  ["すみません","すみません","sumimasen","xin lỗi; xin phép","cụm từ"],
  ["おはよう","おはよう","ohayou","chào buổi sáng","cụm từ"],
  ["こんにちは","こんにちは","konnichiwa","xin chào","cụm từ"],
  ["愛","あい","ai","tình yêu","danh từ"],
  ["時間","じかん","jikan","thời gian","danh từ"],
  ["仕事","しごと","shigoto","công việc","danh từ"],
  ["天気","てんき","tenki","thời tiết","danh từ","今日はいい天気です。","Hôm nay trời đẹp."],
  ["猫","ねこ","neko","con mèo","danh từ"],
  ["犬","いぬ","inu","con chó","danh từ"],
  ["花","はな","hana","hoa","danh từ"],
  ["勉強","べんきょう","benkyou","học tập","danh từ / động từ"],
  ["好き","すき","suki","thích","tính từ"],
  ["元気","げんき","genki","khỏe, sung sức","tính từ","お元気ですか。","Bạn có khỏe không?"]
];

const STORE_KEY = "tudien-viet-nhat-custom";
let custom = [];
try { custom = JSON.parse(localStorage.getItem(STORE_KEY)) || []; } catch (e) { custom = []; }
const words = () => BASE.concat(custom);

// Bỏ dấu tiếng Việt, đưa về chữ thường để tìm không phân biệt dấu
const norm = s => s.normalize("NFD").replace(/[\u0300-\u036f]/g, "")
  .replace(/đ/g, "d").replace(/Đ/g, "D").toLowerCase().trim();
// Đưa katakana về hiragana để tìm chéo
const toHira = s => s.replace(/[\u30a1-\u30f6]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60));
const esc = s => s.replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function score(w, q) {
  const nq = norm(q), hq = toHira(q);
  const fields = [
    [norm(w[3]), nq], [norm(w[2]), nq], [w[0], q], [toHira(w[1]), hq]
  ];
  let best = 0;
  for (const [f, k] of fields) {
    if (!k) continue;
    if (f === k) best = Math.max(best, 3);
    else if (f.split(/[;,]\s*/).includes(k)) best = Math.max(best, 3);
    else if (f.startsWith(k)) best = Math.max(best, 2);
    else if (f.includes(k)) best = Math.max(best, 1);
  }
  return best;
}

function mark(text, q) {
  const t = esc(text), nq = norm(q);
  if (!nq) return t;
  const plain = norm(text);
  const i = plain.indexOf(nq);
  // norm() giữ nguyên độ dài với chữ có dấu tổ hợp sẵn; nếu lệch thì không tô sáng
  if (i < 0 || plain.length !== text.length) return t;
  return esc(text.slice(0, i)) + "<mark>" + esc(text.slice(i, i + nq.length)) + "</mark>" + esc(text.slice(i + nq.length));
}

function render(q) {
  const list = document.getElementById("results");
  const status = document.getElementById("status");
  const all = words();
  const rows = q.trim()
    ? all.map(w => [w, score(w, q)]).filter(x => x[1] > 0).sort((a, b) => b[1] - a[1]).map(x => x[0])
    : all;
  status.textContent = q.trim()
    ? (rows.length ? rows.length + " kết quả cho “" + q.trim() + "”" : "Không tìm thấy “" + q.trim() + "”. Thử gõ không dấu, romaji, hoặc thêm từ này ở phần bên dưới.")
    : "Tất cả " + all.length + " từ";
  list.innerHTML = rows.map(w => {
    const hasKanji = w[0] !== w[1];
    const head = hasKanji ? "<ruby>" + esc(w[0]) + "<rt>" + esc(w[1]) + "</rt></ruby>" : esc(w[0]);
    const ex = w[5] ? '<p class="ex" lang="ja">' + esc(w[5]) + "<span lang=\"vi\">" + esc(w[6] || "") + "</span></p>" : "";
    return '<li class="entry"><div><div class="word" lang="ja">' + head + '</div><div class="romaji">' + esc(w[2]) +
      '</div></div><div><span class="vi">' + mark(w[3], q) + '</span><span class="pos">' + esc(w[4] || "") + "</span>" + ex + "</div></li>";
  }).join("");
}

const input = document.getElementById("q");
input.addEventListener("input", () => render(input.value));

document.getElementById("add").addEventListener("click", () => {
  const v = id => document.getElementById(id).value.trim();
  const msg = document.getElementById("add-msg");
  if (!v("n-jp") || !v("n-vi")) { msg.textContent = "Cần nhập ít nhất chữ Nhật và nghĩa tiếng Việt."; return; }
  custom.push([v("n-jp"), v("n-kana") || v("n-jp"), v("n-romaji"), v("n-vi"), v("n-pos")]);
  try { localStorage.setItem(STORE_KEY, JSON.stringify(custom)); } catch (e) {}
  ["n-jp","n-kana","n-romaji","n-vi","n-pos"].forEach(id => document.getElementById(id).value = "");
  msg.textContent = "Đã lưu “" + custom[custom.length - 1][0] + "”.";
  render(input.value);
});

render("");
</script>
</body>
</html>
